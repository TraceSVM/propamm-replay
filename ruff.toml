line-length = 100
target-version = "py310"
extend-exclude = [
    "target",
    "recordings",
    "output",
    "quoter_output",
    "analysis",
]

[lint]
select = ["E", "W", "F", "I", "B", "UP", "PIE", "RUF"]
ignore = [
    "E501",   # line-too-long
    "E741",   # ambiguous variable name
    "E731",   # lambda assigned to identifier
    "B007",   # unused loop control var
    "B008",   # mutable default args
    "B023",   # function uses loop variable
    "B904",   # raise without `from`
    "B905",   # zip without explicit strict=
    "F841",   # local assigned but unused
    "RUF001", "RUF002", "RUF005", "RUF007", "RUF012", "RUF013", "RUF059",
    "PIE810",
    "UP031",  # percent format vs f-string — matplotlib idiom
]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
